# Deye Monitor — standalone menu bar app + widget that reads the inverter
# directly over Solarman V5 (no dashboard/Docker needed).
# Regenerate the Xcode project after edits: xcodegen generate
name: DeyeMonitor
options:
  bundleIdPrefix: ua.com.mrigne
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  DeyeMonitor:
    type: application
    platform: macOS
    sources:
      - App
      - Core
      - Common
    dependencies:
      - target: DeyeMonitorWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Deye Monitor
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true            # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Deye Monitor reads your solar inverter's data logger on the local network.
    # Not sandboxed: it talks raw TCP to the logger and writes the snapshot
    # the widget reads from ~/Library/Application Support/DeyeMonitor.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor
        PRODUCT_NAME: Deye Monitor
        EXECUTABLE_NAME: DeyeMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DeyeMonitorWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Common
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DeyeMonitorWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read-only access to the snapshot the app writes in the user's home.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/DeyeMonitor/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor.widget
        PRODUCT_NAME: DeyeMonitorWidget

  # ── Mac App Store build ─────────────────────────────────────────────────
  # Same code as DeyeMonitor, but sandboxed and sharing data with the widget
  # through an App Group (compiled with the MAS flag). Distributed only via
  # App Store Connect; the Developer ID .pkg keeps using DeyeMonitor above.
  DeyeMonitorMAS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
      - Core
      - Common
    dependencies:
      - target: DeyeMonitorMASWidget
    info:
      path: MAS/App-Info.plist
      properties:
        CFBundleName: Deye Monitor
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Deye Monitor reads your solar inverter's data logger on the local network.
    entitlements:
      path: MAS/DeyeMonitorMAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [CR2SHW9GDN.ua.com.mrigne.deyemonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor
        PRODUCT_NAME: Deye Monitor
        EXECUTABLE_NAME: DeyeMonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAS
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CR2SHW9GDN

  DeyeMonitorMASWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: [Info.plist, DeyeMonitorWidget.entitlements]
      - Common
    info:
      path: MAS/Widget-Info.plist
      properties:
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MAS/DeyeMonitorMASWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [CR2SHW9GDN.ua.com.mrigne.deyemonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor.widget
        PRODUCT_NAME: DeyeMonitorWidget
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MAS
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CR2SHW9GDN

  # ── iOS ────────────────────────────────────────────────────────────────
  # Signed automatically with your team; the App Group shares settings and the
  # last reading between the app and its widgets.
  DeyeMonitoriOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - Core
      - Common
    dependencies:
      - target: DeyeMonitoriOSWidget
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Deye Monitor reads your solar inverter's data logger on your home network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: iOS/App/DeyeMonitoriOS.entitlements
      properties:
        com.apple.security.application-groups: [group.ua.com.mrigne.deyemonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor.ios
        PRODUCT_NAME: DeyeMonitor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CR2SHW9GDN

  DeyeMonitoriOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widget
      - path: Core
        excludes: [MonitorStore.swift]
      - Common
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: Deye Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Deye Monitor reads your solar inverter's data logger on your home network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget/DeyeMonitoriOSWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ua.com.mrigne.deyemonitor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ua.com.mrigne.deyemonitor.ios.widget
        PRODUCT_NAME: DeyeMonitorWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CR2SHW9GDN
