name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Build (unsigned)
        run: |
          xcodebuild -project DeyeMonitor.xcodeproj -scheme DeyeMonitor -configuration Release \
            -derivedDataPath build build -quiet
      - name: Build iOS (simulator, unsigned)
        run: |
          xcodebuild -project DeyeMonitor.xcodeproj -scheme DeyeMonitoriOS -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
